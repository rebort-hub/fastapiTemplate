<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>账号创建成功</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:#1f2937;">
    <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;">
      <tr>
        <td style="padding:24px 28px;background:#1677ff;color:#fff;font-size:18px;font-weight:700;">{{ project_name }}</td>
      </tr>
      <tr>
        <td style="padding:28px;">
          <p style="margin:0 0 12px;">你好，{{ username }}：</p>
          <p style="margin:0 0 12px;color:#4b5563;line-height:1.7;">你的账号已创建成功，登录信息如下：</p>
          <p style="margin:0 0 8px;"><strong>邮箱：</strong>{{ email }}</p>
          <p style="margin:0 0 20px;"><strong>临时密码：</strong>{{ password }}</p>
          <p style="margin:0;">
            <a href="{{ link }}" style="display:inline-block;padding:10px 20px;background:#1677ff;color:#fff;text-decoration:none;border-radius:8px;">前往登录</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
