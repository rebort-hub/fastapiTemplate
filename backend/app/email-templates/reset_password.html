<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置密码</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
            <tr>
              <td style="padding:28px 32px;background:linear-gradient(135deg,#1677ff,#13c2c2);color:#fff;">
                <div style="font-size:20px;font-weight:700;">{{ project_name }}</div>
                <div style="margin-top:6px;font-size:14px;opacity:0.92;">密码重置通知</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px;font-size:16px;">你好，{{ username }}：</p>
                <p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#4b5563;">
                  我们收到了你的密码重置请求。请在
                  <strong>{{ valid_hours }}</strong>
                  小时内点击下方按钮重置密码。若非本人操作，请忽略本邮件。
                </p>
                <p style="margin:0 0 28px;text-align:center;">
                  <a href="{{ link }}" style="display:inline-block;padding:12px 28px;background:#1677ff;color:#fff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;">
                    重置密码
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:12px;color:#6b7280;">如果按钮无法点击，请复制以下链接到浏览器打开：</p>
                <p style="margin:0;font-size:12px;line-height:1.6;word-break:break-all;color:#1677ff;">{{ link }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 24px;border-top:1px solid #eef2f7;font-size:12px;color:#9ca3af;">
                此邮件由系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
